services:
  backend:
    build:
      context: ./backend
    image: ridebase-v1-dashboard-backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MODEL_DIR: /artifacts/models
      REPORTS_DIR: /artifacts/reports
      OUTPUTS_DIR: /artifacts/outputs
      DATASET_DIR: /artifacts/dataset
    volumes:
      # notebook artifacts, mounted read-only - never written by the app
      - ../ridebase-ml/models:/artifacts/models:ro
      - ../ridebase-ml/reports:/artifacts/reports:ro
      - ../ridebase-ml/outputs:/artifacts/outputs:ro
      - ../ridebase_v1_3/derived_outputs:/artifacts/dataset:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: ridebase-v1-dashboard-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
