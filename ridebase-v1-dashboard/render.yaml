# Render.com blueprint — RideBase V1/V2 inference API (public HTTPS).
# Commit this file at the REPO ROOT as render.yaml, or move it there — Render
# Blueprint paths are resolved from the repo root.
#
#   1. bash ridebase-v1-dashboard/scripts/collect_prod_artifacts.sh   # ~50 MB subset
#   2. commit ridebase-v1-dashboard/backend/artifacts/ (or use a Render disk at /artifacts)
#   3. Render dashboard → New → Blueprint → point at this file
#   4. set ALLOWED_ORIGINS to the Control Center origin(s)
#
# The 5 GB of AutoML experiment artifacts in ridebase-ml/models/ are NOT needed
# at inference — collect_prod_artifacts.sh leaves them out.
services:
  - type: web
    name: ridebase-inference-api
    runtime: docker
    dockerfilePath: ./ridebase-v1-dashboard/backend/Dockerfile.prod
    dockerContext: .
    plan: free                    # 512 MB RAM is enough for the frozen models
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production             # disables /admin/reload (403)
      - key: MODEL_DIR
        value: /artifacts/models
      - key: REPORTS_DIR
        value: /artifacts/reports
      - key: OUTPUTS_DIR
        value: /artifacts/outputs
      - key: DATASET_DIR
        value: /artifacts/dataset
      - key: MODEL_CATALOG_PATH
        value: /app/app/data/ridebase_motorcycle_models_v1.csv
      - key: MAINTENANCE_POLICY_PATH
        value: /app/app/data/maintenance_policies.csv
      - key: V2_1_HISTORY_SOURCE_DIR
        value: /app/app/history_data
      - key: V2_1_HISTORY_SCHEMA_CONTRACT
        value: /app/app/history_config/source_schema_contract_v1_3.json
      - key: ALLOWED_ORIGINS
        # production frontend (Vercel) + Claude Artifact preview
        value: https://ridebase-ml-control-center.vercel.app,https://claude.ai,https://preview.claude.ai
      - key: ALLOWED_ORIGIN_REGEX
        # this Vercel project's per-deploy URLs + published Claude artifacts. Scoped,
        # not a blind *.vercel.app wildcard.
        value: https://(ridebase-ml-control-center-[a-z0-9-]+\.vercel\.app|.*\.claudeusercontent\.com)
      - key: MAX_REQUEST_BYTES
        value: "1000000"
