<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>RideBase ML Control Center</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#090c12; --surface:#10141d; --surface-2:#161b26; --surface-3:#1c2230;
    --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
    --text:#f4f6fa; --text-2:#a9b1c2; --muted:#737c8d;
    --accent:#ff7a29; --accent-ink:#1a0d03; --accent-tint:rgba(255,122,41,.14);
    --accent-2:#3ec6ff; --accent-2-tint:rgba(62,198,255,.14);
    --good:#35c235; --warning:#fab219; --critical:#ff6b6b;
    --good-tint:rgba(53,194,53,.14); --warning-tint:rgba(250,178,25,.14); --critical-tint:rgba(255,107,107,.14);
    --chart-1:#3987e5; --chart-2:#d95926; --chart-3:#199e70; --chart-4:#c98500;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 36px rgba(0,0,0,.5);
    --sidebar-w:248px; --maxw:1180px;
    --panel-bg:#05070b; --panel-surface:#10141d; --panel-border:rgba(255,255,255,.08);
    --panel-text:#f4f6fa; --panel-muted:#8891a3;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Plus Jakarta Sans",-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  ::selection{background:var(--accent-tint)}
  .num,.metric-num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  h1,h2,h3,h4{margin:0;text-wrap:balance}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#2a3140;border-radius:8px}
  :focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:4px}

  /* ============ layout shell ============ */
  .shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
  .sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel-bg);border-right:1px solid var(--border);
    display:flex;flex-direction:column;gap:4px;padding:20px 14px}
  .brand{display:flex;flex-direction:column;gap:2px;padding:6px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:8px}
  .brand .logo{font:800 1.06rem/1 var(--sans);letter-spacing:.01em;display:flex;align-items:center}
  .brand .logo .bolt{color:var(--accent);display:inline-flex;margin:0 1px}
  .brand .logo .bolt svg{width:11px;height:16px}
  .brand small{font:600 .62rem/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:5px}
  .nav-group{margin-top:12px}
  .nav-group .glabel{font:700 .6rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
  .nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:var(--text-2);
    font:600 .82rem/1 var(--sans);padding:9px 10px;border-radius:8px;cursor:pointer;position:relative}
  .nav-item .ic{width:15px;height:15px;flex:none;opacity:.8}
  .nav-item:hover{background:var(--surface-2);color:var(--text)}
  .nav-item.active{background:var(--accent-tint);color:var(--accent)}
  .nav-item.sub{padding-left:30px;font-size:.78rem;font-weight:500}
  .nav-item .soon{margin-left:auto;font:700 .54rem/1 var(--sans);letter-spacing:.08em;padding:3px 6px;border-radius:999px;
    background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
  .sidebar-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
  .sidebar-foot .row{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
  .sidebar-foot .row b{color:var(--text-2);font-family:var(--mono)}
  .kbd{font:600 .66rem/1 var(--mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:2px 5px;color:var(--text-2)}

  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{display:none;position:sticky;top:0;z-index:30;background:var(--panel-bg);border-bottom:1px solid var(--border);
    padding:10px 16px;align-items:center;gap:12px}
  .topbar .logo{font:800 .95rem/1 var(--sans)}
  .topbar .logo .bolt{color:var(--accent)}
  .hamburger{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);width:36px;height:36px;font-size:1rem;cursor:pointer}
  .content{padding:34px clamp(16px,4vw,44px) 80px;max-width:calc(var(--maxw) + 88px);width:100%;margin:0 auto}

  /* ============ module header ============ */
  .mod-head{margin-bottom:26px}
  .mod-head .eyebrow{font:700 .68rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .mod-head h1{font-size:clamp(1.5rem,3vw,2.05rem);font-weight:800;margin-top:8px}
  .mod-head p.lede{color:var(--text-2);font-size:.95rem;max-width:66ch;margin:8px 0 0}
  .mod-head .chips{margin-top:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font:600 .72rem/1 var(--sans);padding:6px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);
    display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
  .chip.accent{background:var(--accent-tint);color:var(--accent);border-color:transparent}
  .chip.cyan{background:var(--accent-2-tint);color:var(--accent-2);border-color:transparent}
  .chip.good{background:var(--good-tint);color:var(--good);border-color:transparent}
  .chip.warn{background:var(--warning-tint);color:var(--warning);border-color:transparent}
  .chip.bad{background:var(--critical-tint);color:var(--critical);border-color:transparent}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .provenance{margin-top:12px;font-size:.74rem;color:var(--muted);font-family:var(--mono)}
  .provenance code{color:var(--text-2)}

  /* ============ sections / grids / cards ============ */
  .sec{padding:26px 0;border-top:1px solid var(--border)}
  .sec:first-of-type{border-top:none;padding-top:6px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .sec-head h2{font-size:1.18rem;font-weight:700}
  .sec-head .tag{font:600 .68rem/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;
    background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
  .sec-intro{color:var(--text-2);font-size:.9rem;max-width:70ch;margin:-6px 0 16px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  @media (max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
  .card.tint{background:var(--accent-tint);border-color:transparent}
  .card.cyan-tint{background:var(--accent-2-tint);border-color:transparent}
  .card h3{font-size:1.02rem;font-weight:700;margin-bottom:3px}
  .card .sub{color:var(--muted);font-size:.8rem;margin-bottom:14px}
  .card p.copy{font-size:.87rem;color:var(--text-2);margin:0 0 10px}

  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;height:100%;width:3px;background:var(--accent)}
  .kpi.cyan::before{background:var(--accent-2)}
  .kpi.plain::before{background:var(--border-strong)}
  .kpi .eyebrow{font:700 .62rem/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .kpi .value{font:700 1.7rem/1.05 var(--mono);margin-top:8px;letter-spacing:-.01em}
  .kpi .value small{font-size:.86rem;color:var(--muted);font-weight:500;font-family:var(--sans)}
  .kpi .note{font-size:.74rem;color:var(--muted);margin-top:5px}
  /* V2: non-technical KPI annotations — kept small so the main number stays dominant */
  .kpi .eyebrow .info{margin-left:5px;color:var(--muted);font:400 .82rem/1 var(--sans);cursor:help;vertical-align:baseline;text-transform:none;letter-spacing:0}
  .kpi .eyebrow .info:hover{color:var(--accent-2)}
  .kpi .xpl{font-size:.7rem;line-height:1.4;color:var(--text-2);margin-top:6px}
  .kpi .dir{font:600 .62rem/1.35 var(--sans);letter-spacing:.02em;margin-top:5px;color:var(--muted)}
  .kpi .dir b{color:var(--accent-2);font-weight:700}
  .kpi .dir .mut{color:var(--muted);font-weight:600}
  .kpi .kbadge{display:inline-block;margin-top:8px;padding:2px 8px;border-radius:999px;font:700 .6rem/1.3 var(--sans);letter-spacing:.04em;background:var(--surface-3);color:var(--text-2)}
  .kpi .kbadge.good{background:var(--good-tint);color:var(--good)}
  .kpi .kbadge.warn{background:var(--warning-tint);color:var(--warning)}
  .kpi .kbadge.crit{background:var(--critical-tint);color:var(--critical)}

  /* beginner-friendly explainers — "what does this page tell you?" + technical-detail accordion */
  .pagenote{background:var(--accent-2-tint);border:1px solid transparent;border-left:3px solid var(--accent-2);
    border-radius:10px;padding:14px 16px;margin:0 0 18px;font-size:.88rem;color:var(--text-2)}
  .pagenote b{display:block;font:700 .64rem/1.4 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);margin-bottom:5px}
  .pagenote p{margin:0}
  .pagenote p + p{margin-top:7px}
  .pagenote .term{color:var(--muted);font-size:.8rem}
  details.tech{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
  details.tech summary{cursor:pointer;font:600 .72rem/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);list-style:none}
  details.tech summary::-webkit-details-marker{display:none}
  details.tech summary::before{content:"▸ ";color:var(--accent-2)}
  details.tech[open] summary::before{content:"▾ "}
  details.tech .tbody{margin-top:8px;font-size:.82rem;color:var(--text-2)}
  details.tech .tbody code{font-size:.9em;color:var(--text-2)}
  ol.tk{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:.88rem;color:var(--text-2)}
  ol.tk li b,ol.tk li strong{color:var(--text)}
  .info{margin-left:5px;color:var(--muted);font:400 .82rem/1 var(--sans);cursor:help;vertical-align:baseline;text-transform:none;letter-spacing:0}
  .info:hover{color:var(--accent-2)}

  /* bar list */
  .bars{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .bar{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:10px}
  .bar .lbl{font-size:.79rem;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{height:13px;background:var(--surface-2);border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent);border-radius:4px}
  .bar .fill.cyan{background:var(--accent-2)}
  .bar .val{font:600 .76rem/1 var(--mono);color:var(--text);text-align:right;white-space:nowrap}
  .bar .val small{color:var(--muted);font-weight:500}

  /* table */
  .twrap{overflow-x:auto}
  table.tbl{width:100%;border-collapse:collapse;font-size:.83rem;min-width:520px}
  table.tbl th{text-align:left;font:600 .64rem/1 var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  table.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:top}
  table.tbl tr:last-child td{border-bottom:none}
  table.tbl td.k{color:var(--text);font-weight:600;white-space:nowrap}
  table.tbl td.n,table.tbl th.n{font-family:var(--mono);text-align:right;white-space:nowrap}
  table.tbl tbody tr:hover{background:var(--surface-2)}
  table.tbl tr.hl{background:var(--accent-tint)}

  /* finding callout */
  .finding{display:flex;gap:12px;padding:13px 15px;border-radius:8px;border-left:3px solid var(--border);background:var(--surface-2);font-size:.85rem;margin-top:12px}
  .finding .tl{flex:none;font:700 .6rem/1.4 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px;min-width:58px}
  .finding b{display:block;margin-bottom:2px;color:var(--text)}
  .finding p{margin:0;color:var(--text-2)}
  .finding.good{background:var(--good-tint);border-left-color:var(--good)} .finding.good .tl{color:var(--good)}
  .finding.warn{background:var(--warning-tint);border-left-color:var(--warning)} .finding.warn .tl{color:var(--warning)}
  .finding.bad{background:var(--critical-tint);border-left-color:var(--critical)} .finding.bad .tl{color:var(--critical)}

  /* status pill */
  .pill{display:inline-flex;align-items:center;gap:6px;font:700 .64rem/1 var(--sans);letter-spacing:.04em;padding:4px 9px;border-radius:999px;text-transform:uppercase}
  .pill.ok{background:var(--good-tint);color:var(--good)}
  .pill.active{background:var(--accent-tint);color:var(--accent)}
  .pill.warn{background:var(--warning-tint);color:var(--warning)}
  .pill.bad{background:var(--critical-tint);color:var(--critical)}
  .pill.plan{background:var(--surface-3);color:var(--muted)}
  .pill.info{background:var(--accent-2-tint);color:var(--accent-2)}

  /* module cards on overview */
  .modcard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);text-align:left;cursor:pointer;width:100%}
  .modcard:hover:not(:disabled){border-color:var(--border-strong);transform:translateY(-1px);transition:transform .12s,border-color .12s}
  .modcard:disabled{opacity:.55;cursor:not-allowed}
  .modcard .mc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .modcard .mc-id{font:800 .95rem/1 var(--mono);color:var(--accent)}
  .modcard .mc-id.cyan{color:var(--accent-2)}
  .modcard h3{font-size:1.02rem}
  .modcard .mc-tag{font-size:.78rem;color:var(--muted)}
  .modcard .mc-cta{font:700 .72rem/1 var(--sans);color:var(--text-2);letter-spacing:.03em;text-transform:uppercase;margin-top:2px}

  /* timeline */
  .timeline{display:flex;flex-direction:column;gap:0;position:relative;margin-left:6px}
  .tl-item{display:grid;grid-template-columns:16px 1fr;gap:14px;padding:9px 0}
  .tl-item .tl-mark{position:relative;display:flex;justify-content:center}
  .tl-item .tl-mark::before{content:"";position:absolute;top:16px;bottom:-18px;width:2px;background:var(--border)}
  .tl-item:last-child .tl-mark::before{display:none}
  .tl-item .tl-dot{width:11px;height:11px;border-radius:50%;background:var(--surface-3);border:2px solid var(--muted);margin-top:4px;z-index:1}
  .tl-item[data-kind="data"] .tl-dot{border-color:var(--accent-2);background:var(--accent-2-tint)}
  .tl-item[data-kind="model"] .tl-dot{border-color:var(--accent);background:var(--accent-tint)}
  .tl-item[data-kind="experiment"] .tl-dot{border-color:var(--warning);background:var(--warning-tint)}
  .tl-item[data-kind="ui"] .tl-dot{border-color:var(--good);background:var(--good-tint)}
  .tl-item .tl-body b{font-size:.86rem;color:var(--text);font-weight:600}
  .tl-item .tl-body span{display:block;font-size:.78rem;color:var(--muted)}

  /* progress bar */
  .prog{display:flex;flex-direction:column;gap:10px}
  .prog-row{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:12px}
  .prog-row .pl{font-size:.82rem;color:var(--text-2)}
  .prog-row .pt{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
  .prog-row .pf{height:100%;border-radius:999px;background:var(--accent)}
  .prog-row .pf.done{background:var(--good)} .prog-row .pf.zero{background:var(--surface-3)}
  .prog-row .pv{font:600 .72rem/1 var(--mono);color:var(--muted)}

  /* activity feed */
  .feed{display:flex;flex-direction:column}
  .feed-item{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
  .feed-item:last-child{border-bottom:none}
  .feed-item:hover{background:var(--surface-2)}
  .feed-item .fi-l{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:74px}
  .feed-item .fi-date{font:600 .68rem/1 var(--mono);color:var(--muted)}
  .feed-item .fi-body b{font-size:.86rem;color:var(--text)}
  .feed-item .fi-body p{margin:3px 0 0;font-size:.8rem;color:var(--text-2)}
  .feed-item .fi-meta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}

  /* sub-tabs (V1) */
  .subtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:22px;padding-bottom:0}
  .subtab{flex:none;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-2);font:600 .78rem/1 var(--sans);
    padding:10px 12px;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
  .subtab:hover{color:var(--text)}
  .subtab.active{color:var(--accent);border-bottom-color:var(--accent)}

  .empty{border:1px dashed var(--border);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:.83rem}
  .mono-block{background:var(--panel-bg);border:1px solid var(--border);border-radius:8px;padding:12px;font:.72rem/1.6 var(--mono);color:var(--text-2);overflow-x:auto;white-space:pre}
  figure.fig{margin:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface-2)}
  figure.fig img{display:block;width:100%;height:auto;background:#fff}
  figure.fig figcaption{padding:8px 10px;font-size:.74rem;color:var(--muted);border-top:1px solid var(--border)}

  /* command palette */
  .palette-back{position:fixed;inset:0;background:rgba(3,5,9,.66);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
  .palette-back.on{display:flex}
  .palette{width:min(560px,92vw);background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .palette input{width:100%;background:var(--panel-bg);border:none;border-bottom:1px solid var(--border);color:var(--text);font:500 .95rem/1 var(--sans);padding:15px 16px;outline:none}
  .palette .results{max-height:52vh;overflow-y:auto}
  .palette .pr{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;font-size:.85rem;color:var(--text-2)}
  .palette .pr:hover,.palette .pr.sel{background:var(--accent-tint);color:var(--text)}
  .palette .pr .pr-k{margin-left:auto;font:600 .64rem/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .palette .pr small{color:var(--muted)}

  /* ============ EDA module — component CSS scoped under .eda-scope ============ */
  .eda-scope .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .eda-scope .section-head h2{font-size:clamp(1.3rem,2.4vw,1.7rem);font-weight:700}
  .eda-scope .section-head .tag{font:600 .7rem/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border-radius:999px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
  .eda-scope section{padding:30px 0;border-bottom:1px solid var(--border)}
  .eda-scope section:last-of-type{border-bottom:none}
  .eda-scope .section-intro{color:var(--text-2);font-size:.92rem;max-width:72ch;margin:-8px 0 20px}
  .eda-scope .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media (max-width:900px){.eda-scope .kpi-grid{grid-template-columns:repeat(2,1fr)}}
  .eda-scope .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 18px 16px;box-shadow:var(--shadow)}
  .eda-scope .kpi .eyebrow{font:700 .64rem/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

function r3(v){return v==null||v!==v?"—":Number(v).toFixed(3);}
function pct(v,d){return v==null||v!==v?"—":(v*100).toFixed(d==null?1:d)+"%";}
function sgn(v,f){if(v==null||v!==v)return "—";var s=(f||n1)(Math.abs(v));return (v>0?"+":v<0?"−":"")+s;}
function asNum(v){var x=typeof v==="string"?parseFloat(v):v;return (typeof x==="number"&&isFinite(x))?x:null;}
function statusPill(s){s=(s||"").toLowerCase();
  if(s==="complete"||s==="pass"||s==="frozen"||s==="baseline")return '<span class="pill ok">'+esc(s||"complete")+'</span>';
  if(s==="active")return '<span class="pill active">active</span>';
  if(s==="in_progress"||s==="in progress")return '<span class="pill active">in progress</span>';
  if(s==="planned")return '<span class="pill plan">coming soon</span>';
  if(s==="info")return '<span class="pill info">info</span>';
  if(s==="warning"||s==="review")return '<span class="pill warn">'+esc(s)+'</span>';
  if(s==="failed"||s==="fail")return '<span class="pill bad">'+esc(s)+'</span>';
  return '<span class="pill plan">'+esc(s||"—")+'</span>';}
function card(title,sub,body){return '<div class="card"><h3>'+esc(title)+'</h3>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+body+'</div>';}
function kpi(label,value,note,accent){return '<div class="kpi '+(accent||'')+'"><div class="eyebrow">'+esc(label)+'</div><div class="value">'+value+'</div>'+(note?'<div class="note">'+note+'</div>':'')+'</div>';}
/* V2 explanatory KPI — value keeps its visual weight; small lines below explain the metric for non-technical users. o={xpl,dir,badge,badgeKind,tip,accent} */
function v2kpi(label,value,o){o=o||{};
  var tip=o.tip?'<span class="info" title="'+esc(o.tip)+'" role="img" aria-label="bilgi">&#9432;</span>':'';
  var dir=o.dir?'<div class="dir">'+o.dir+'</div>':'';
  var xpl=o.xpl?'<div class="xpl">'+esc(o.xpl)+'</div>':'';
  var badge=o.badge?'<div class="kbadge '+(o.badgeKind||'')+'">'+esc(o.badge)+'</div>':'';
  return '<div class="kpi '+(o.accent||'')+'"><div class="eyebrow">'+esc(label)+tip+'</div>'
    +'<div class="value">'+value+'</div>'+xpl+dir+badge+'</div>';
}
function v2dir(good,ref){return '<b>'+esc(good)+'</b>'+(ref?' · <span class="mut">'+esc(ref)+'</span>':'');}
function barRows(items,accent){return '<div class="bars">'+items.map(function(it){
  var w=Math.max(1,Math.min(100,it.pct));
  return '<div class="bar"><div class="lbl">'+esc(it.label)+'</div><div class="track"><div class="fill '+(accent||'')+'" style="width:'+w+'%"></div></div><div class="val">'+it.val+'</div></div>';
}).join('')+'</div>';}
function tbl(cols,rows,hlFn){
  return '<div class="twrap"><table class="tbl"><thead><tr>'+cols.map(function(c){return '<th class="'+(c.n?'n':'')+'">'+esc(c.label)+'</th>';}).join('')+'</tr></thead><tbody>'+
   rows.map(function(row){return '<tr class="'+(hlFn&&hlFn(row)?'hl':'')+'">'+cols.map(function(c){
     var v=c.get?c.get(row):row[c.key];return '<td class="'+(c.n?'n':'')+(c.k?' k':'')+'">'+(v==null?'—':v)+'</td>';
   }).join('')+'</tr>';}).join('')+'</tbody></table></div>';
}
function finding(kind,label,html){return '<div class="finding '+(kind||'')+'"><div class="tl">'+esc(label)+'</div><div>'+html+'</div></div>';}
function emptyBox(t){return '<div class="empty">'+esc(t||"Artifact not available")+'</div>';}
/* beginner-friendly helpers — plain Turkish first, technical detail second */
function pageNote(html,tech,term){return '<div class="pagenote"><b>Bu sayfa ne anlatıyor?</b><p>'+html+'</p>'
  +(term?'<p class="term">'+esc(term)+'</p>':'')+(tech?techBox(tech):'')+'</div>';}
function techBox(html){return '<details class="tech"><summary>Teknik detay</summary><div class="tbody">'+html+'</div></details>';}
function takeaways(items){return '<div class="sec">'+card("Bu sayfadan çıkarman gereken 3 şey",null,

var ROUTES = {
  overview:{label:"Overview",render:renderOverview},
  eda:{label:"EDA",render:renderEda},

};
function parseHash(){
  var h=(location.hash||"#overview").replace(/^#/,"");
  var parts=h.split("/");
  return {route:ROUTES[parts[0]]?parts[0]:"overview",sub:parts[1]||null};
}
function go(hash){location.hash=hash;}
function route(){
  var st=parseHash();
  buildSidebar(st);

  view.focus();

  if(st.route==="v2" && st.sub==="predict" && typeof wireV2Predict==="function")wireV2Predict();
  $("#shell").classList.remove("drawer");
}

/* monthly line-chart interactivity (verbatim from the EDA source) */
function initMonthlyChart(){
  var wrap=document.getElementById('monthlyWrap');
  var dot=document.getElementById('mdot'), vline=document.getElementById('mvline'), tip=document.getElementById('mtip');
  if(!wrap||!dot||!tip)return;
  var data=window.__EDA_MONTHLY__||[];
  if(!data.length)return;
  var monthNames=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  function fmt(p){var q=p.split('-');return monthNames[parseInt(q[1],10)-1]+' '+q[0];}
  var padL=6,plotW=988,nn=data.length;
  var tipLbl=tip.querySelector('.tip-lbl'), tipVal=tip.querySelector('.tip-val');
  function show(i){var d=data[i];dot.setAttribute('cx',d.x);dot.setAttribute('cy',d.y);vline.setAttribute('x1',d.x);vline.setAttribute('x2',d.x);
    dot.style.opacity=1;vline.style.opacity=1;tip.style.opacity=1;tip.style.left=(d.x/1000*100)+'%';tip.style.top=(d.y/280*100)+'%';
    tipLbl.textContent=fmt(d.p);tipVal.textContent=d.v.toLocaleString('tr-TR');}
  function hide(){dot.style.opacity=0;vline.style.opacity=0;tip.style.opacity=0;}
  function mv(evt){var rect=wrap.getBoundingClientRect();var cx=evt.touches?evt.touches[0].clientX:evt.clientX;

function v2ValidateScenario(p){

  if(p.production_year<1900||p.production_year>new Date().getFullYear())e.push("Model yılı mantıklı aralıkta olmalı.");
  if(p.current_odometer_km!=null&&(p.current_odometer_km<0||p.current_odometer_km>2000000))e.push("Güncel kilometre geçersiz.");
  if(p.last_service_odometer_km!=null&&p.current_odometer_km==null)e.push("Son servis kilometresi için güncel kilometre de gerekli.");

/* ---------------- command palette + search ---------------- */
function paletteIndex(){
  var idx=[];
  Object.keys(ROUTES).forEach(function(r){idx.push({t:"Open "+ROUTES[r].label,s:"module",go:r});});
  [["days","V1 · DAYS"],["km","V1 · KM"],["models","V1 · Models"],["features","V1 · Features"],["errors","V1 · Errors"],
   ["drift","V1 · Drift"],["experiments","V1 · Experiments"],["predict","V1 · Live Prediction"],["verdict","V1 · Verdict"]]
   .forEach(function(p){idx.push({t:p[1],s:"v1 tab",go:"v1/"+p[0]});});
  (M.notebooks||[]).forEach(function(nb){idx.push({t:"NB "+nb.n+" — "+nb.title,s:nb.file,go:nb.module==="v1"?"v1/experiments":(nb.module||"experiments")});});
  (M.models||[]).forEach(function(m){idx.push({t:m.name,s:"model · MAE "+(m.mae==null?"—":(m.mae>200?n0(m.mae):n1(m.mae))),go:"models"});});
  (M.datasets||[]).forEach(function(d){idx.push({t:(d.label||d.version)+" dataset",s:d.purpose,go:"dataset"});});
  CL.forEach(function(e){idx.push({t:e.title,s:e.module+" · "+e.timestamp,go:moduleHash(e.module)});});
  idx.push({t:"KM MAE",s:"V1 primary metric",go:"v1/km"});
  idx.push({t:"DAYS MAE",s:"V1 secondary metric",go:"v1/days"});
  idx.push({t:"policy_interval_km",s:"feature — External Knowledge experiment",go:"v1/experiments"});
  idx.push({t:"censoring / right-censored",s:"V2 motivation",go:"v2"});
  return idx;
}
var PIDX=null, PSEL=0, PFILT=[];
function openPalette(){
  if(!PIDX)PIDX=paletteIndex();
  $("#paletteBack").classList.add("on");
  var inp=$("#paletteInput"); inp.value=""; PSEL=0; filterPalette("");
  setTimeout(function(){inp.focus();},20);
}
function closePalette(){$("#paletteBack").classList.remove("on");}
function filterPalette(q){
  q=(q||"").toLowerCase().trim();
  PFILT=!q?PIDX.slice(0,9):PIDX.filter(function(it){return (it.t+" "+it.s).toLowerCase().indexOf(q)>=0;}).slice(0,30);
  PSEL=0;
  $("#paletteResults").innerHTML=PFILT.length?PFILT.map(function(it,i){
    return '<div class="pr'+(i===0?' sel':'')+'" data-i="'+i+'">'+esc(it.t)+' <small>'+esc(it.s)+'</small><span class="pr-k">↵</span></div>';
  }).join(''):'<div class="pr"><small>Sonuç yok</small></div>';
  $("#paletteResults").querySelectorAll(".pr[data-i]").forEach(function(el){
    el.addEventListener("click",function(){choosePalette(+el.getAttribute("data-i"));});
  });
}
function choosePalette(i){var it=PFILT[i];if(it){closePalette();go(it.go);}}
document.addEventListener("keydown",function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();return;}
  if(!$("#paletteBack").classList.contains("on"))return;
  if(e.key==="Escape")closePalette();
  else if(e.key==="ArrowDown"){e.preventDefault();PSEL=Math.min(PFILT.length-1,PSEL+1);paintSel();}
  else if(e.key==="ArrowUp"){e.preventDefault();PSEL=Math.max(0,PSEL-1);paintSel();}
  else if(e.key==="Enter"){e.preventDefault();choosePalette(PSEL);}
});
function paintSel(){$("#paletteResults").querySelectorAll(".pr[data-i]").forEach(function(el,i){el.classList.toggle("sel",i===PSEL);});}
$("#paletteInput").addEventListener("input",function(e){filterPalette(e.target.value);});
$("#paletteBack").addEventListener("click",function(e){if(e.target===$("#paletteBack"))closePalette();});
