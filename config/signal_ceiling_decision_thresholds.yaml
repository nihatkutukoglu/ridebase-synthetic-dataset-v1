# Signal Ceiling & Oracle Gap Study — Predeclared Decision Thresholds
version: 1.0.0
study: RIDEBASE_V1_5_SIGNAL_CEILING_ORACLE_GAP

metrics:
  primary: ipcw_c_index
  secondary:
    - integrated_brier_score
    - mean_horizon_auc
    - brier_score_90d

materiality_thresholds:
  # C-index gain thresholds
  meaningful_c_gain: 0.0100
  strong_c_gain: 0.0200
  negligible_c_gain: 0.0050

  # Integrated Brier Score (lower is better, improvement is reduction)
  meaningful_ibs_reduction: 0.0050
  negligible_ibs_reduction: 0.0010

  # Temporal stability: gain must be positive across all validation temporal slices
  require_temporal_consistency: true

decision_tree_criteria:
  case_a_missing_observable_signal:
    description: "Observable C ~ 0.72, but Latent/Oracle C materially higher (>= +0.01 or >= +0.02)."
    action: "STOP same-table feature engineering; identify and collect real operational signals."

  case_b_generator_stochasticity_ceiling:
    description: "Latent/Oracle C also near ~0.72 (gap < 0.01), and generator hazard ranking is capped by high conditional randomness."
    action: "STOP chasing higher C-index; recognize stochastic event process limit in V1.5."

  case_c_model_family_gap:
    description: "Alternative model family (e.g. discrete-time hazard) materially outperforms continuous XGB-Cox on O2 by >= 0.01."
    action: "JUSTIFIED to design V2.4 model family challenger."

  case_d_diminishing_returns_near_oracle:
    description: "Observable O2 captures nearly all available latent signal (gap < 0.005)."
    action: "FREEZE synthetic model research; wait for real fleet data."
